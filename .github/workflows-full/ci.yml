name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: sanitization and OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-sanitization.sh
      - uses: astral-sh/setup-uv@v6
      - name: OpenAPI reference matches the app
        working-directory: apps/api
        run: uv sync --frozen && uv run pytest tests/unit -q -k openapi_drift

  integration:
    name: integration tests (Postgres 16, Redis 7, ClickHouse 24, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: logmind
          POSTGRES_PASSWORD: logmind
          POSTGRES_DB: logmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logmind"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.12.2.29-alpine
        env:
          CLICKHOUSE_USER: logmind
          CLICKHOUSE_PASSWORD: logmind
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping"
          --health-interval 3s --health-timeout 3s --health-retries 40
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports: ["8025:8025", "1025:1025"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://logmind:logmind@localhost:5432/logmind_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_CLICKHOUSE_URL: http://logmind:logmind@localhost:8123/logmind_test
      TEST_MAILPIT_URL: http://localhost:8025
      TEST_SMTP_PORT: "1025"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12 && uv sync --frozen
      # The suite serves the mock AI service itself (tests/integration/conftest.py).
      - run: uv run pytest tests/unit tests/integration -q --cov=logmind --cov-report=term-missing:skip-covered --cov-fail-under=85
