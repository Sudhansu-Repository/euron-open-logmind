[project]
name = "euron-logmind"
version = "0.1.0"
description = "Python SDK for Euron Open LogMind: ship structured log lines to a self-hosted LogMind."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ENGAGESPHERE TECHNOLOGY PRIVATE LIMITED and the Euron Open LogMind contributors" }]
requires-python = ">=3.10"
keywords = ["logging", "logs", "observability", "log-management", "structured-logging", "logmind"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
# The SDK needs only an HTTP client.
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/euron-sde-team/euron-open-logmind"
Documentation = "https://github.com/euron-sde-team/euron-open-logmind/blob/main/sdks/python/README.md"
Issues = "https://github.com/euron-sde-team/euron-open-logmind/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euron_logmind"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "PT"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "E501", "PT011", "PT018", "SIM117", "BLE001"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running LogMind API (set LOGMIND_TEST_API_URL and LOGMIND_TEST_API_KEY)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["euron_logmind"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
