# ─────────────────────────────────────────────────────────────────────────────
# Euron Open LogMind: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
# (scripts/test-db.sh is the one exception: it starts only the data services from here.)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports, all on 127.0.0.1 (override in .env if they clash with something you run;
# see docs/PLAN.md "Ports" for the assigned block, project 20, base 6000):
#   web 6010   api 6030   postgres 6042   redis 6079   clickhouse 6023
#   mailpit 6025 (SMTP 6026)   mock AI 6050   floci 6066
# ─────────────────────────────────────────────────────────────────────────────
name: logmind

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile
  target: server

x-api-env: &api-env
  # Development mode: the local stack talks to an emulator and links to localhost, both
  # of which the production guards refuse on purpose.
  ENVIRONMENT: development
  LOGMIND_CLOUD: local
  LOG_LEVEL: ${LM_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://logmind:logmind@postgres:5432/logmind
  REDIS_URL: redis://redis:6379/0
  # ClickHouse holds log_events. User, password and database ride in the URL, matching
  # the clickhouse service's own CLICKHOUSE_USER/CLICKHOUSE_PASSWORD/CLICKHOUSE_DB.
  CLICKHOUSE_URL: http://logmind:logmind@clickhouse:8123/logmind
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  # Keys: a local key kept outside the database (compose.floci.yaml switches to KMS).
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/evidence
  COOKIE_SECURE: "false"
  # The web container proxies /api with X-Forwarded-For; trust it on the Compose network.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${LM_WEB_PORT:-6010},http://127.0.0.1:${LM_WEB_PORT:-6010}
  PUBLIC_URL: http://localhost:${LM_WEB_PORT:-6010}
  SIGNUP_ENABLED: "true"
  # Alert email lands in Mailpit (http://localhost:6025).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: LogMind Alerts <alerts@logmind.local>
  # `logmind seed-demo` (make demo, inside the api container) is a real HTTP client of the
  # API and the mock AI service over the Compose network.
  LOGMIND_API_URL: http://localhost:8080
  LOGMIND_MOCK_AI_URL: http://mockai:6050
  LOGMIND_DEMO_PASSWORD: ${LM_DEMO_PASSWORD:-Demo-Owner-Pass-1}
  # The worker evaluates alert rules this often (seconds).
  ALERT_INTERVAL_S: ${LM_ALERT_INTERVAL_S:-20}

x-server: &server
  image: logmind-server:local
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001
  restart: unless-stopped

x-probe: &probe
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: logmind
      POSTGRES_USER: logmind
      POSTGRES_PASSWORD: logmind
    ports:
      - "127.0.0.1:${LM_PG_PORT:-6042}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logmind -d logmind"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Config cache version stamp, dashboard aggregate cache, rate limits and the live log
  # stream relay. noeviction: the config version stamp must never be evicted, or a replica
  # could keep serving a revoked API key past its TTL.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LM_REDIS_PORT:-6079}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The log store: log_events and its per-minute rollup (docs/architecture/data-model.md).
  # HTTP interface on 6023; the native protocol port stays inside Compose.
  clickhouse:
    image: clickhouse/clickhouse-server:24.12.2.29-alpine
    environment:
      CLICKHOUSE_DB: logmind
      CLICKHOUSE_USER: logmind
      CLICKHOUSE_PASSWORD: logmind
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - "127.0.0.1:${LM_CLICKHOUSE_PORT:-6023}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      <<: *probe
    restart: unless-stopped

  # Catches every email the app sends (web UI on 6025, SMTP on 6026 for tests).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${LM_MAILPIT_PORT:-6025}:8025"
      - "127.0.0.1:${LM_SMTP_PORT:-6026}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *probe
    restart: unless-stopped

  # Mock AI service: OpenAI, Anthropic, Gemini and Ollama wire formats answered by the
  # deterministic analyst, plus a webhook and Slack sink, so `make demo` and `make e2e`
  # need no provider key and no outside network.
  mockai:
    <<: *server
    build: *server-build
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "6050", "--no-access-log"]
    ports:
      - "127.0.0.1:${LM_MOCK_AI_PORT:-6050}:6050"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6050/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe

  # Migrate first (Postgres through Alembic, then the ClickHouse schema): the api and the
  # worker start only once both schemas are in place.
  migrate:
    <<: *server
    command: ["migrate"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  api:
    <<: *server
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${LM_API_PORT:-6030}:8080"
    volumes:
      - evidence:/data/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      mockai:
        condition: service_healthy

  # The worker: AI investigations and follow-ups, alert evaluation and delivery, retention.
  worker:
    <<: *server
    command: ["worker"]
    environment:
      <<: *api-env
    volumes:
      - evidence:/data/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # The dashboard. The browser talks to this origin; the web app proxies /api to the api.
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        API_URL: http://api:8080
    image: logmind-web:local
    environment:
      API_URL: http://api:8080
      API_INTERNAL_URL: http://api:8080
      PUBLIC_API_WS_URL: ws://localhost:${LM_API_PORT:-6030}
      PORT: "8080"
    ports:
      - "127.0.0.1:${LM_WEB_PORT:-6010}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *probe
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  clickhousedata:
  evidence:
