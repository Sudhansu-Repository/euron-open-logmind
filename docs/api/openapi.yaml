components:
  schemas:
    AlertCreated:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        kind:
          type: string
          title: Kind
        metric:
          type: string
          title: Metric
        query:
          type: string
          title: Query
        service:
          type: string
          title: Service
        environment:
          type: string
          title: Environment
        threshold:
          type: number
          title: Threshold
        window_minutes:
          type: integer
          title: Window Minutes
        sensitivity:
          type: number
          title: Sensitivity
        min_count:
          type: integer
          title: Min Count
        baseline_hours:
          type: integer
          title: Baseline Hours
        email_to:
          items:
            type: string
          type: array
          title: Email To
        has_webhook:
          type: boolean
          title: Has Webhook
        has_slack:
          type: boolean
          title: Has Slack
        cooldown_minutes:
          type: integer
          title: Cooldown Minutes
        enabled:
          type: boolean
          title: Enabled
        state:
          type: string
          title: State
        last_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Value
        last_evaluated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Evaluated At
        last_fired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Fired At
        created_at:
          type: string
          format: date-time
          title: Created At
        webhook_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Secret
          description: Verifies X-LogMind-Signature. Shown once, at creation
      type: object
      required:
      - id
      - project_id
      - name
      - kind
      - metric
      - query
      - service
      - environment
      - threshold
      - window_minutes
      - sensitivity
      - min_count
      - baseline_hours
      - email_to
      - has_webhook
      - has_slack
      - cooldown_minutes
      - enabled
      - state
      - last_value
      - last_evaluated_at
      - last_fired_at
      - created_at
      title: AlertCreated
    AlertHistoryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        rule_id:
          type: string
          format: uuid
          title: Rule Id
        rule_name:
          type: string
          title: Rule Name
          default: ''
        at:
          type: string
          format: date-time
          title: At
        event:
          type: string
          title: Event
        value:
          type: number
          title: Value
        threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold
        expected:
          anyOf:
          - type: number
          - type: 'null'
          title: Expected
        zscore:
          anyOf:
          - type: number
          - type: 'null'
          title: Zscore
        message:
          type: string
          title: Message
        deliveries:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Deliveries
      type: object
      required:
      - id
      - rule_id
      - at
      - event
      - value
      - threshold
      - expected
      - zscore
      - message
      - deliveries
      title: AlertHistoryOut
    AlertIn:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        kind:
          type: string
          enum:
          - threshold
          - anomaly
          title: Kind
          default: threshold
        metric:
          type: string
          enum:
          - error_count
          - error_rate
          - log_count
          - matching_count
          title: Metric
          default: error_count
        query:
          type: string
          maxLength: 300
          title: Query
          description: Keywords, for matching_count
          default: ''
        service:
          type: string
          maxLength: 64
          title: Service
          description: 'Only this service (empty: all)'
          default: ''
        environment:
          type: string
          maxLength: 64
          title: Environment
          default: ''
