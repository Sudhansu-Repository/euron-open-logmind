<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Euron Open LogMind architecture</title>
  <desc id="d">Sources send logs to the API, which redacts, fingerprints and stores them in ClickHouse and Postgres. The worker runs AI investigations and alerts. The web dashboard reads through the API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="44" font-size="20" font-weight="650" fill="#0f172a">Euron Open LogMind</text>
    <text x="40" y="68" font-size="13" fill="#475569">Collect, redact and store logs; group errors; investigate with cited evidence; alert on live data.</text>

    <g font-size="13">
      <text x="40" y="112" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">SOURCES</text>
      <rect x="40" y="124" width="200" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="56" y="148" font-weight="600" fill="#0f172a">Python and Node SDKs</text>
      <text x="56" y="167" font-size="11.5" fill="#64748b">batched, retried</text>
      <rect x="40" y="192" width="200" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="56" y="216" font-weight="600" fill="#0f172a">OpenTelemetry</text>
      <text x="56" y="235" font-size="11.5" fill="#64748b">OTLP/HTTP protobuf or JSON</text>
      <rect x="40" y="260" width="200" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="56" y="284" font-weight="600" fill="#0f172a">Plain HTTP</text>
      <text x="56" y="303" font-size="11.5" fill="#64748b">POST /api/v1/logs</text>

      <rect x="330" y="124" width="290" height="192" rx="14" fill="#e0f2fe"/>
      <text x="350" y="152" font-size="15" font-weight="650" fill="#075985">api (FastAPI)</text>
      <text x="350" y="178" fill="#0f172a">1. API key to one project</text>
      <text x="350" y="200" fill="#0f172a">2. Normalise and window check</text>
      <text x="350" y="222" fill="#0f172a">3. Redact PII and secrets</text>
      <text x="350" y="244" fill="#0f172a">4. Fingerprint error lines</text>
      <text x="350" y="266" fill="#0f172a">5. Store, upsert groups</text>
      <text x="350" y="288" fill="#0f172a">6. Publish to Live Logs</text>

      <rect x="720" y="110" width="210" height="64" rx="12" fill="#fff7ed"/>
      <text x="736" y="136" font-weight="650" fill="#9a3412">ClickHouse</text>
      <text x="736" y="156" font-size="11.5" fill="#9a3412">log_events, log_rollup_1m</text>
      <rect x="720" y="186" width="210" height="64" rx="12" fill="#eef2ff"/>
      <text x="736" y="212" font-weight="650" fill="#3730a3">PostgreSQL</text>
      <text x="736" y="232" font-size="11.5" fill="#3730a3">projects, error groups, reports</text>
      <rect x="720" y="262" width="210" height="64" rx="12" fill="#fef2f2"/>
      <text x="736" y="288" font-weight="650" fill="#991b1b">Redis</text>
      <text x="736" y="308" font-size="11.5" fill="#991b1b">caches, rate limits, live stream</text>

      <rect x="330" y="380" width="290" height="160" rx="14" fill="#ecfdf5"/>
      <text x="350" y="408" font-size="15" font-weight="650" fill="#065f46">worker</text>
      <text x="350" y="434" fill="#0f172a">AI investigations and follow-ups</text>
      <text x="350" y="456" fill="#0f172a">evidence, compression, citations</text>
      <text x="350" y="478" fill="#0f172a">Alert rules: threshold, anomaly</text>
      <text x="350" y="500" fill="#0f172a">Retention per project</text>
      <text x="350" y="522" font-size="11.5" fill="#64748b">jobs claimed FOR UPDATE SKIP LOCKED</text>

      <rect x="720" y="380" width="210" height="64" rx="12" fill="#f1f5f9"/>
      <text x="736" y="406" font-weight="650" fill="#0f172a">S3 (KMS)</text>
      <text x="736" y="426" font-size="11.5" fill="#475569">evidence packs</text>
      <rect x="720" y="456" width="210" height="84" rx="12" fill="#faf5ff"/>
      <text x="736" y="482" font-weight="650" fill="#6b21a8">AI provider</text>
      <text x="736" y="502" font-size="11.5" fill="#6b21a8">OpenAI, Anthropic, Gemini,</text>
      <text x="736" y="520" font-size="11.5" fill="#6b21a8">Ollama, compatible, mock</text>

      <rect x="1000" y="124" width="160" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1016" y="150" font-weight="650" fill="#0f172a">web (Next.js)</text>
      <text x="1016" y="172" font-size="11.5" fill="#475569">overview, explorer,</text>
      <text x="1016" y="190" font-size="11.5" fill="#475569">live, errors, services,</text>
      <text x="1016" y="208" font-size="11.5" fill="#475569">investigations, alerts</text>
      <rect x="1000" y="400" width="160" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1016" y="426" font-weight="650" fill="#0f172a">Notifications</text>
      <text x="1016" y="448" font-size="11.5" fill="#475569">email (SES, Mailpit)</text>
      <text x="1016" y="466" font-size="11.5" fill="#475569">signed webhooks</text>
      <text x="1016" y="484" font-size="11.5" fill="#475569">Slack</text>
    </g>

    <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M240 152H326"/>
      <path d="M240 220H326"/>
      <path d="M240 288H326"/>
      <path d="M620 160H716"/>
      <path d="M620 218H716"/>
      <path d="M620 294H716"/>
      <path d="M475 316V376"/>
      <path d="M620 412H716"/>
      <path d="M620 496H716"/>
      <path d="M620 440C680 440 680 150 716 150"/>
      <path d="M930 460H996"/>
      <path d="M1080 244V300H936"/>
    </g>
    <text x="40" y="596" font-size="11.5" fill="#64748b">Every log query carries the organisation and project of a verified scope. Redaction runs before anything is stored or published.</text>
  </g>
</svg>
